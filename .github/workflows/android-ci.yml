name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Verify API 36 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 platform
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The repository does not yet contain a Gradle Wrapper. Pin the CI
      # distribution explicitly; AGP 8.12.2 requires Gradle 8.13.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          add-job-summary: 'on-failure'

      - name: Run core network unit tests
        run: gradle --no-daemon :core:network:testDebugUnitTest

      - name: Check sensitive-data source boundaries
        run: sh tools/check-sensitive-data-boundaries.sh

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify unsigned release bundle, tests, and lint
        run: gradle --no-daemon :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hcloud-control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
