android.useAndroidX=true
# Release dexing for the API 36 toolchain needs more than Gradle's conservative
# default heap. Keep it below the memory available to this WSL environment and
# run a single worker so the build remains repeatable on ARM64 machines.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
